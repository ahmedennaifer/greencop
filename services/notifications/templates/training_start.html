<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f9f9f9; padding: 30px; border-radius: 0 0 8px 8px; }
        .info { background: white; padding: 15px; margin: 10px 0; border-radius: 4px; border-left: 4px solid #667eea; }
        .button { display: inline-block; padding: 12px 24px; background: #667eea; color: white; text-decoration: none; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Model Training Started</h1>
        </div>
        <div class="content">
            <p>Your ML models are now being retrained with the latest validated predictions.</p>

            <div class="info">
                <strong>Training Run:</strong> #{{ run_id }}<br>
                <strong>Started:</strong> {{ timestamp }}
            </div>

            <p style="color: #666; font-size: 14px; margin-top: 20px;">
                You'll receive another notification when training completes. This typically takes 3-5 seconds.
            </p>
        </div>
    </div>
</body>
</html>
